[package]
name = "remote-telemetry"
version = "0.1.0"
edition = "2024"

[dependencies]
heapless = "0.9.2"
raylib = { version = "5.5.1", default-features = false, features = [
    "opengl_es_20",
] }
tokio = { version = "1.48.0", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "io-util",
] }
tokio-serial = "5.4.5"
tokio-tungstenite = "0.24.0"
tungstenite = "0.24.0"
futures-util = "0.3.31"
zerocopy = { version = "0.8.48", features = ["derive"] }
