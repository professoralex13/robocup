[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
rtic = { version = "2", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "1", default-features = false, features = [
    "cortex-m-systick",
] }

# Remove these if you don't want logging.
imxrt-log = { version = "0.1", default-features = false, features = [
    "log",
    "usbd",
] }
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_info",
] }

teensy4-panic = { version = "0.2", features = ["log"] }
heapless = { version = "0.9.3", default-features = false }
rtic-sync = "1.4.0"
bno055 = "0.4.0"
embedded-hal = "1.0.0"

[dependencies.teensy4-bsp]
version = "0.5"
features = [
    # Use the BSP's runtime.
    "rt",
]

[dependencies.zerocopy]
workspace = true

[dependencies.lidar-lib]
workspace = true
[dependencies.linalg]
git = "https://github.com/UCCR1/positioning-system"
[dependencies.uom]
git = "https://github.com/UCCR1/uom"
default-features = false
features = ["si", "f32", "libm"]

[profile.dev]
opt-level = "z"   # Optimize for size
lto = true        # Enable Link Time Optimization (LTO)
codegen-units = 1
